packages:
  - 'apps/*'
  - 'packages/*'

# The pnpm catalog is the single version authority for every dependency shared by
# the app (apps/web) and the framework-glue package
# (packages/shopify-app-tanstack-start). Bump versions here, once. See ADR 0008.
catalog:
  # React 19 (ADR 0008)
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5

  # TanStack Start / Router — exact pins from the ENG-2321 model research (ADR 0008)
  '@tanstack/react-start': 1.168.49
  '@tanstack/react-router': 1.170.32
  '@tanstack/router-plugin': 1.168.35
  '@tanstack/react-query': 5.102.8

  # Shopify base packages — glue-only dependency (ADR 0001 / ADR 0008)
  '@shopify/shopify-api': 14.0.1
  '@shopify/shopify-app-session-storage': 6.0.1
  '@shopify/shopify-app-session-storage-drizzle': 5.0.1
  '@shopify/admin-api-client': 2.0.0
  '@shopify/api-codegen-preset': 3.0.0

  # Data layer (ADR 0005 / WS1). drizzle-orm stays a caret range: the 1.0.0-rc
  # line ERESOLVEs against the session-storage-drizzle adapter peer.
  drizzle-orm: ^0.45.0
  drizzle-kit: 0.30.6
  pg: 8.23.0
  '@types/pg': 8.15.6

  # Build / tooling shared across workspaces (ADR 0008 / ADR 0009)
  typescript: 5.9.3
  vite: 8.2.2
  '@types/node': 22.20.1
