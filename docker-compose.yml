# Local Postgres for the Shopify session store (ADR 0005).
# `pnpm db:up` = `docker compose up -d --wait` -> `db:migrate` -> `db:seed`.
# The matching connection string is in apps/web/.env.example (DATABASE_URL).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: shopify
      POSTGRES_DB: shopify_tanstack_starter
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopify -d shopify_tanstack_starter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
